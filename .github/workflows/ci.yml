name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make web-check
      - run: pip install ruff
      - run: ruff check backend
      - run: PYTHONPATH=backend python3 -m unittest discover -s backend/tests -v
