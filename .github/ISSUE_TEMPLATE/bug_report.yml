name: Bug report
description: Report a reproducible problem without including personal data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include real notes, contacts, recordings, secrets, or vulnerability details. See SECURITY.md for private reports."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
