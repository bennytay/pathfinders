[project]
name = "circle-visual-intelligence"
version = "0.1.0"
description = "Evidence-first visual person intelligence service for Circle."
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "hdbscan>=0.8.40,<1",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]
gpu = [
  "insightface>=0.7.3,<1",
  "torch>=2.5,<3",
  "transformers>=4.46,<5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI dependency injection is intentionally expressed as Depends(...) defaults.
