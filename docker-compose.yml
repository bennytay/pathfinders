services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: circle
      POSTGRES_USER: circle
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - circle-postgres:/var/lib/postgresql/data
      - ./backend/sql/migrations/001_visual_person_intelligence.sql:/docker-entrypoint-initdb.d/001_visual_person_intelligence.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circle -d circle"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - circle-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: circle-local
      MINIO_ROOT_PASSWORD: change-me-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - circle-media:/data

  api:
    build: ./backend
    environment:
      CIRCLE_DATABASE_URL: postgresql+psycopg://circle:change-me-local-only@postgres:5432/circle
      CIRCLE_REDIS_URL: redis://redis:6379/0
      CIRCLE_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    environment:
      CIRCLE_DATABASE_URL: postgresql+psycopg://circle:change-me-local-only@postgres:5432/circle
      CIRCLE_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  circle-postgres:
  circle-redis:
  circle-media:
