name: CircleDemo
options:
  bundleIdPrefix: com.circle.demo
  deploymentTarget:
    iOS: "17.0"
targets:
  CircleDemo:
    type: application
    platform: iOS
    sources:
      - CircleDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.circle.demo
        INFOPLIST_FILE: CircleDemo/Info.plist
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
